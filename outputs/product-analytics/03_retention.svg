<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640">
<rect width="1000" height="640" fill="#222222"/>
<style>
  text {
    font-family: 'Vela Sans GX', 'Inter', 'Arial', sans-serif;
    font-weight: 700;
