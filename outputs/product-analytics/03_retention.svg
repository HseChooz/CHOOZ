<text x="715.0" y="533" fill="#FFFFFF" font-size="20px" text-anchor="middle">Day 14</text>
<text x="60" y="560" fill="#FFFFFF" font-size="19px" text-anchor="start">Примечание: на малой выборке exact-day retention может быть нестабильным.</text>
