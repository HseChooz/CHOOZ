query MyWishlistShareLink {
  myWishlistShareLink {
    url
    isEnabled
  }
}

query WishlistShareTarget($token: String!) {
  wishlistShareTarget(token: $token) {
    userId
  }
}

mutation PrepareWishlistShareLink {
  prepareWishlistShareLink {
    url
    isEnabled
  }
}

mutation DisableWishlistShareLink {
  disableWishlistShareLink {
    url
    isEnabled
  }
}

mutation RegenerateWishlistShareLink {
  regenerateWishlistShareLink {
    url
    isEnabled
  }
}
